<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#8b949e"/>
    </marker>
  </defs>
  <rect width="980" height="560" rx="12" fill="url(#bg)"/>
  <text x="490" y="34" text-anchor="middle" fill="#e6edf3" font-size="20" font-weight="600">SentinelSRE — agent proposes, deterministic code permits</text>

  <!-- Alert -->
  <rect x="30" y="60" width="120" height="52" rx="8" fill="#8b2f2f" stroke="#f85149" stroke-width="1.5"/>
  <text x="90" y="82" text-anchor="middle" fill="#ffe1df" font-size="13" font-weight="600">ALERT</text>
  <text x="90" y="99" text-anchor="middle" fill="#ffb4ae" font-size="10">checkout 5xx</text>

  <!-- LangGraph pipeline -->
  <rect x="30" y="140" width="920" height="120" rx="10" fill="#0d1117" stroke="#30363d"/>
  <text x="46" y="162" fill="#79c0ff" font-size="12" font-weight="600">LangGraph workflow (sqlite-checkpointed, interrupt() approvals)</text>

  <!-- nodes -->
  <g font-size="11" font-weight="600" text-anchor="middle">
    <rect x="50" y="180" width="92" height="40" rx="7" fill="#1f6feb"/><text x="96" y="203" fill="#fff">triage</text>
    <rect x="156" y="180" width="104" height="40" rx="7" fill="#1f6feb"/><text x="208" y="197" fill="#fff">investigate</text><text x="208" y="211" fill="#9ecbff" font-size="9">tools loop</text>
    <rect x="274" y="180" width="92" height="40" rx="7" fill="#1f6feb"/><text x="320" y="203" fill="#fff">plan</text>
    <rect x="380" y="180" width="104" height="40" rx="7" fill="#9e6a03"/><text x="432" y="197" fill="#ffd77a">policy gate</text><text x="432" y="211" fill="#e3b341" font-size="9">deterministic</text>
    <rect x="498" y="180" width="92" height="40" rx="7" fill="#8957e5"/><text x="544" y="197" fill="#fff">approve</text><text x="544" y="211" fill="#d2a8ff" font-size="9">interrupt()</text>
    <rect x="604" y="180" width="100" height="40" rx="7" fill="#238636"/><text x="654" y="197" fill="#fff">remediate</text><text x="654" y="211" fill="#a6f0c6" font-size="9">token-gated</text>
    <rect x="718" y="180" width="92" height="40" rx="7" fill="#238636"/><text x="764" y="203" fill="#fff">verify</text>
    <rect x="824" y="180" width="106" height="40" rx="7" fill="#484f58"/><text x="877" y="203" fill="#e6edf3">report</text>
  </g>
  <g stroke="#8b949e" stroke-width="1.4" marker-end="url(#arr)">
    <line x1="142" y1="200" x2="154" y2="200"/><line x1="260" y1="200" x2="272" y2="200"/>
    <line x1="366" y1="200" x2="378" y2="200"/><line x1="484" y1="200" x2="496" y2="200"/>
    <line x1="590" y1="200" x2="602" y2="200"/><line x1="704" y1="200" x2="716" y2="200"/>
    <line x1="810" y1="200" x2="822" y2="200"/>
  </g>
  <line x1="90" y1="112" x2="90" y2="178" stroke="#f85149" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- rollback / escalate note -->
  <text x="764" y="244" text-anchor="middle" fill="#ffa198" font-size="10">fail → rollback → escalate</text>

  <!-- tool factory + policy -->
  <rect x="30" y="285" width="450" height="110" rx="10" fill="#0d1117" stroke="#30363d"/>
  <text x="46" y="308" fill="#79c0ff" font-size="12" font-weight="600">tools/factory.py — the bouncer</text>
  <g font-size="11" fill="#c9d1d9">
    <text x="46" y="330">budget tick → token redeem → backend call →</text>
    <text x="46" y="348">evidence + audit → redact → truncate</text>
  </g>
  <rect x="46" y="360" width="196" height="24" rx="6" fill="#9e6a03"/>
  <text x="144" y="376" text-anchor="middle" fill="#ffd77a" font-size="11" font-weight="600">policy.yaml — allow/deny</text>
  <rect x="256" y="360" width="200" height="24" rx="6" fill="#8957e5"/>
  <text x="356" y="376" text-anchor="middle" fill="#e3d1ff" font-size="11" font-weight="600">HMAC single-use tokens</text>

  <!-- backends -->
  <rect x="500" y="285" width="450" height="110" rx="10" fill="#0d1117" stroke="#30363d"/>
  <text x="516" y="308" fill="#79c0ff" font-size="12" font-weight="600">OpsBackend (typed protocol — no shell)</text>
  <rect x="516" y="322" width="200" height="56" rx="8" fill="#1f6feb"/>
  <text x="616" y="346" text-anchor="middle" fill="#fff" font-size="11" font-weight="600">LocalProcess</text>
  <text x="616" y="362" text-anchor="middle" fill="#9ecbff" font-size="10">in-host ops calls</text>
  <rect x="734" y="322" width="200" height="56" rx="8" fill="#1f6feb"/>
  <text x="834" y="346" text-anchor="middle" fill="#fff" font-size="11" font-weight="600">HarborOpsBackend</text>
  <text x="834" y="362" text-anchor="middle" fill="#9ecbff" font-size="10">sre-ops via env.exec</text>
  <line x1="432" y1="220" x2="255" y2="283" stroke="#8b949e" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="654" y1="220" x2="725" y2="283" stroke="#8b949e" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- platform -->
  <rect x="30" y="420" width="450" height="110" rx="10" fill="#0d1117" stroke="#30363d"/>
  <text x="46" y="443" fill="#79c0ff" font-size="12" font-weight="600">demo platform (real FastAPI services)</text>
  <g font-size="11" font-weight="600" text-anchor="middle">
    <rect x="46" y="456" width="128" height="56" rx="8" fill="#21262d" stroke="#f85149" stroke-width="1.4"/>
    <text x="110" y="478" fill="#e6edf3">checkout-service</text><text x="110" y="494" fill="#ffa198" font-size="9">:8081 — broken dep</text>
    <rect x="188" y="456" width="128" height="56" rx="8" fill="#21262d" stroke="#3fb950" stroke-width="1.4"/>
    <text x="252" y="478" fill="#e6edf3">inventory-service</text><text x="252" y="494" fill="#a6f0c6" font-size="9">:8082</text>
    <rect x="330" y="456" width="128" height="56" rx="8" fill="#21262d" stroke="#3fb950" stroke-width="1.4"/>
    <text x="394" y="478" fill="#e6edf3">order-worker</text><text x="394" y="494" fill="#a6f0c6" font-size="9">queue drainer</text>
  </g>
  <line x1="110" y1="456" x2="252" y2="512" stroke="#f85149" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arr)"/>

  <!-- eval -->
  <rect x="500" y="420" width="450" height="110" rx="10" fill="#0d1117" stroke="#30363d"/>
  <text x="516" y="443" fill="#79c0ff" font-size="12" font-weight="600">evaluation &amp; observability</text>
  <g font-size="11" fill="#c9d1d9">
    <text x="516" y="468">• Harbor task + verifier → reward.json (cloud sandbox)</text>
    <text x="516" y="488">• LangSmith traces — every model/tool call correlated</text>
    <text x="516" y="508">• local benchmark → benchmark.json (2/2 RESOLVED)</text>
  </g>
</svg>
